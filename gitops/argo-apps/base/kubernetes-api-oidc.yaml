apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-api-oidc
  namespace: argocd
  annotations:
    # Keycloak and its realm import must be available before the API server
    # attempts OIDC discovery.
    argocd.argoproj.io/sync-wave: "23"
  labels:
    app.kubernetes.io/name: kubernetes-api-oidc
    app.kubernetes.io/part-of: platform-baseline
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ${ARGOCD_ENV_gitops_root_app_repo_url}
    targetRevision: ${ARGOCD_ENV_gitops_root_app_target_revision}
    path: gitops/apps/kubernetes-api-oidc
    plugin:
      name: envsubst
      env:
        - name: base_domain
          value: "${ARGOCD_ENV_base_domain}"
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-api-oidc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=background
      - PruneLast=true
