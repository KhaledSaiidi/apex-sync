apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    dashboards: grafana
spec:
  config:
    server:
      root_url: https://grafana.${ARGOCD_ENV_base_domain}
    auth:
      disable_login_form: "true"
      oauth_auto_login: "true"
    auth.generic_oauth:
      enabled: "true"
      name: Keycloak
      allow_sign_up: "true"
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://keycloak.${ARGOCD_ENV_base_domain}/realms/oidc/protocol/openid-connect/auth
      token_url: https://keycloak.${ARGOCD_ENV_base_domain}/realms/oidc/protocol/openid-connect/token
      api_url: https://keycloak.${ARGOCD_ENV_base_domain}/realms/oidc/protocol/openid-connect/userinfo
      role_attribute_path: contains(groups[*], 'GrafanaAdmins') && 'Admin' || contains(groups[*], 'GrafanaEditors') && 'Editor' || 'Viewer'
      allow_assign_grafana_admin: "true"
    log:
      mode: console
    security:
      admin_user: admin
  deployment:
    spec:
      replicas: ${ARGOCD_ENV_grafana_replicas}
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc-client-secret
                      key: oidc.keycloak.clientSecret
              resources:
                requests:
                  cpu: "${ARGOCD_ENV_resource_grafana_requests_cpu}"
                  memory: "${ARGOCD_ENV_resource_grafana_requests_memory}"
                limits:
                  cpu: "${ARGOCD_ENV_resource_grafana_limits_cpu}"
                  memory: "${ARGOCD_ENV_resource_grafana_limits_memory}"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
