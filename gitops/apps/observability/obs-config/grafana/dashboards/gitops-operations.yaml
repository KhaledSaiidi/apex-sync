            },
            "textMode": "auto"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "Mimir"
              },
              "expr": "count(argocd_app_info{health_status=\"Progressing\"})",
              "legendFormat": "progressing",
              "refId": "A"
            }
          ],
          "title": "Applications Progressing",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "Mimir"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
