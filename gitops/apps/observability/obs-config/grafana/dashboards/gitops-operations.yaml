            {
              "datasource": {
                "type": "prometheus",
                "uid": "Mimir"
              },
              "expr": "count(argocd_app_info{name=\"app-of-apps\",sync_status!=\"Synced\"}) + count(argocd_app_info{name=\"app-of-apps\",health_status!=\"Healthy\"})",
