              "legendFormat": "heap",
              "refId": "A"
            }
          ],
          "title": "Heap Used",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "Mimir"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
