apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: keycloak-overview
  namespace: observability
spec:
  allowCrossNamespaceImport: false
  datasources:
    - datasourceName: Mimir
      inputName: Mimir
    - datasourceName: Loki
      inputName: Loki
  folderRef: observability
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 10m0s
  json: |-
    {
