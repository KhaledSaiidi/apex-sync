            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "Mimir"
              },
              "expr": "sum by (state) (jvm_threads_states_threads{namespace=\"keycloak\"})",
              "legendFormat": "{{state}}",
              "refId": "A"
            }
          ],
          "title": "JVM Threads",
          "type": "timeseries"
