              "expr": "sum by (method) (rate(http_server_requests_seconds_sum{namespace=\"keycloak\"}[5m])) / sum by (method) (rate(http_server_requests_seconds_count{namespace=\"keycloak\"}[5m]))",
              "legendFormat": "{{method}} avg",
              "refId": "A"
            }
          ],
          "title": "HTTP Latency Average",
          "type": "timeseries"
