apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-app-credentials-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pg-app-credentials-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "5"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pg-app-credentials-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pg-app-credentials-bootstrap
subjects:
  - kind: ServiceAccount
    name: pg-app-credentials-bootstrap
