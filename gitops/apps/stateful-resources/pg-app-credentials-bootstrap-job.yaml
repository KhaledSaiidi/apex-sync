apiVersion: batch/v1
kind: Job
metadata:
  name: pg-app-credentials-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-app-credentials-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pg-app-credentials-bootstrap
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reflect-credentials
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_APP_SECRET_NAME
              value: "${ARGOCD_ENV_stateful_resources_pg_app_secret_name}"
            - name: PG_APP_REFLECTION_NAMESPACES
              value: "${ARGOCD_ENV_stateful_resources_pg_app_reflection_namespaces}"
          resources:
            requests:
              cpu: "${ARGOCD_ENV_resource_stateful_resources_pg_app_bootstrap_requests_cpu}"
              memory: "${ARGOCD_ENV_resource_stateful_resources_pg_app_bootstrap_requests_memory}"
            limits:
              cpu: "${ARGOCD_ENV_resource_stateful_resources_pg_app_bootstrap_limits_cpu}"
              memory: "${ARGOCD_ENV_resource_stateful_resources_pg_app_bootstrap_limits_memory}"
          command:
            - /scripts/reflect-pg-app-credentials.sh
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: pg-app-credentials-bootstrap-script
            defaultMode: 0555
