apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-oidc-client-secret-sync
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "40"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-oidc-client-secret-sync
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "40"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-oidc-client-secret"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-oidc-client-secret-sync
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "40"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-oidc-client-secret-sync
subjects:
  - kind: ServiceAccount
    name: grafana-oidc-client-secret-sync
    namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-oidc-client-secret-sync
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-oidc-client-secret-sync
    spec:
      restartPolicy: OnFailure
      serviceAccountName: grafana-oidc-client-secret-sync
      volumes:
        - name: oidc-client-secret
          emptyDir: {}
        - name: read-keycloak-client-secret-script
          configMap:
            name: argocd-oidc-read-keycloak-client-secret-script
            defaultMode: 0555
        - name: write-argocd-secret-script
          configMap:
            name: argocd-oidc-write-argocd-secret-script
            defaultMode: 0555
      initContainers:
        - name: read-keycloak-client-secret
          image: quay.io/keycloak/keycloak:${ARGOCD_ENV_keycloak_operator_version}
          imagePullPolicy: IfNotPresent
          command:
            - /scripts/read-keycloak-client-secret.sh
          env:
            - name: CLIENT_ID
              value: grafana
            - name: OUTPUT_PATH
              value: /work/grafana-client-secret
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
          volumeMounts:
            - name: oidc-client-secret
              mountPath: /work
            - name: read-keycloak-client-secret-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: write-grafana-secret
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /scripts/write-argocd-secret.sh
          env:
            - name: INPUT_PATH
              value: /work/grafana-client-secret
            - name: SECRET_NAME
              value: grafana-oidc-client-secret
            - name: REFLECTION_NAMESPACES
              value: observability
            - name: PART_OF_LABEL
              value: grafana
          volumeMounts:
            - name: oidc-client-secret
              mountPath: /work
            - name: write-argocd-secret-script
              mountPath: /scripts
              readOnly: true
