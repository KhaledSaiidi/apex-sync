apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-oidc-client-secret-sync
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "40"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-oidc-client-secret-sync
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-secret"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-oidc-client-secret-sync
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-oidc-client-secret-sync
subjects:
  - kind: ServiceAccount
    name: argocd-oidc-client-secret-sync
    namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-oidc-client-secret-sync
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-oidc-client-secret-sync
    spec:
      restartPolicy: OnFailure
      serviceAccountName: argocd-oidc-client-secret-sync
      volumes:
        - name: oidc-client-secret
          emptyDir: {}
        - name: read-keycloak-client-secret-script
          configMap:
            name: argocd-oidc-read-keycloak-client-secret-script
            defaultMode: 0555
        - name: write-argocd-secret-script
          configMap:
            name: argocd-oidc-write-argocd-secret-script
            defaultMode: 0555
      initContainers:
        - name: read-keycloak-client-secret
          image: quay.io/keycloak/keycloak:${ARGOCD_ENV_keycloak_operator_version}
          imagePullPolicy: IfNotPresent
          command:
            - /scripts/read-keycloak-client-secret.sh
          env:
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
          volumeMounts:
            - name: oidc-client-secret
              mountPath: /work
            - name: read-keycloak-client-secret-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: write-argocd-secret
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /scripts/write-argocd-secret.sh
          volumeMounts:
            - name: oidc-client-secret
              mountPath: /work
            - name: write-argocd-secret-script
              mountPath: /scripts
              readOnly: true
