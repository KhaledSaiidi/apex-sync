apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubernetes-api-oidc
resources:
  - namespace.yaml
  - rbac.yaml
  - oidc-enable-hook.yaml
configMapGenerator:
  - name: kubernetes-api-oidc-enable-script
    files:
      - configure-oidc.sh=scripts/configure-oidc.sh
generatorOptions:
  disableNameSuffixHash: true
